name: Build

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

# Cancel superseded runs on the same ref (keeps PR feedback fast).
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in sync with Makefile RELEASE_VERSION / firmware DOCKER_IMAGE.
  DOCKER_IMAGE: sylverb/retro-go-sd-builder:v1.5

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      project_kind: ${{ steps.meta.outputs.project_kind }}
      packed_bin: ${{ steps.meta.outputs.packed_bin }}
      target_elf: ${{ steps.meta.outputs.target_elf }}
      target_map: ${{ steps.meta.outputs.target_map }}
      locale_ids: ${{ steps.meta.outputs.locale_ids }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          # Full history + tags so `git describe --tags --dirty` works for CORE_VERSION.
          fetch-depth: 0

      - name: Read project metadata
        id: meta
        run: |
          set -euo pipefail
          PROJECT_KIND="$(make --no-print-directory -f Makefile print-PROJECT_KIND)"
          PACKED_BIN="$(make --no-print-directory -f Makefile print-PACKED_BIN)"
          TARGET_ELF="$(make --no-print-directory -f Makefile print-TARGET_ELF)"
          TARGET_MAP="$(make --no-print-directory -f Makefile print-TARGET_MAP)"
          LOCALE_IDS="$(make --no-print-directory -f Makefile print-LOCALE_IDS | tr '\n' ' ' | sed 's/[[:space:]]*$//')"
          echo "project_kind=${PROJECT_KIND}" >> "${GITHUB_OUTPUT}"
          echo "packed_bin=${PACKED_BIN}" >> "${GITHUB_OUTPUT}"
          echo "target_elf=${TARGET_ELF}" >> "${GITHUB_OUTPUT}"
          echo "target_map=${TARGET_MAP}" >> "${GITHUB_OUTPUT}"
          echo "locale_ids=${LOCALE_IDS}" >> "${GITHUB_OUTPUT}"
          echo "PROJECT_KIND=${PROJECT_KIND}"
          echo "PACKED_BIN=${PACKED_BIN}"
          echo "TARGET_ELF=${TARGET_ELF}"
          echo "TARGET_MAP=${TARGET_MAP}"
          echo "LOCALE_IDS=${LOCALE_IDS}"

      - name: Install host deps (SDL 1.2 + Pillow + p7zip + unrar)
        run: |
          set -euo pipefail
          sudo apt-get update
          # unrar: Spanish Orden pack is .rar (p7zip cannot open all RAR variants)
          sudo apt-get install -y --no-install-recommends \
            libsdl1.2-dev pkg-config python3-pip p7zip-full unrar
          python3 -m pip install --user -r requirements.txt

      - name: Build GWHB binary (Docker)
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "${{ github.workspace }}:/opt/workdir" \
            -w /opt/workdir \
            "${{ env.DOCKER_IMAGE }}" \
            make --no-print-directory -j"$(nproc)" all

      - name: Build locale NXPKs (en, fr, …)
        run: |
          set -euo pipefail
          make --no-print-directory ci-assets-all
          # Verify every catalogued locale pack landed under sd_content/.
          while IFS= read -r loc; do
            nxpk="$(make --no-print-directory -f Makefile print-NXPK LOCALE="${loc}")"
            test -f "${nxpk}"
            echo "ok ${loc} → ${nxpk}"
          done < <(make --no-print-directory -f Makefile print-LOCALE_IDS)
          test -f "${{ steps.meta.outputs.packed_bin }}"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            ${{ steps.meta.outputs.packed_bin }}
            ${{ steps.meta.outputs.target_elf }}
            ${{ steps.meta.outputs.target_map }}
            sd_content/homebrews/*.nxpk
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          # Full history + tags so `git describe --tags --dirty` works for CORE_VERSION.
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: dist

      - name: Stage release assets
        run: |
          set -euo pipefail
          PACKED_BIN="${{ needs.build.outputs.packed_bin }}"
          TARGET_ELF="${{ needs.build.outputs.target_elf }}"
          TARGET_MAP="${{ needs.build.outputs.target_map }}"

          nxpk_args=()
          while IFS= read -r loc; do
            nxpk_name="$(python3 -c "import sys; sys.path.insert(0,'scripts'); from cavestory_locales import get_locale; print(get_locale(sys.argv[1]).nxpk)" "${loc}")"
            # Artifact download preserves relative paths under dist/.
            src="dist/sd_content/homebrews/${nxpk_name}"
            test -f "${src}"
            nxpk_args+=(--nxpk-locale "${loc}=${src}")
          done < <(make --no-print-directory -f Makefile print-LOCALE_IDS)

          python3 scripts/stage_release.py \
            --bin "dist/${PACKED_BIN}" \
            --elf "dist/${TARGET_ELF}" \
            --map "dist/${TARGET_MAP}" \
            "${nxpk_args[@]}" \
            --tag "${GITHUB_REF_NAME}" \
            --out release \
            --docker-image "${{ env.DOCKER_IMAGE }}"

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          mapfile -t names < release/release-files.txt
          files=()
          for name in "${names[@]}"; do
            files+=("release/${name}")
          done
          gh release create "${TAG}" \
            --title "${TAG}" \
            --notes-file release/RELEASE_NOTES.md \
            "${files[@]}"
